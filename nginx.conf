# ─────────────────────────────────────────────────────────────────────────────
#  Nginx reverse-proxy config for Medical Distribution System
#
#  Place this at:  /etc/nginx/sites-available/medical-dist
#  Enable:         sudo ln -s /etc/nginx/sites-available/medical-dist /etc/nginx/sites-enabled/
#  Test:           sudo nginx -t
#  Reload:         sudo systemctl reload nginx
#
#  Replace yourdomain.com with your actual domain.
#  For HTTPS, run:  sudo certbot --nginx -d yourdomain.com -d api.yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

# ── Frontend (Next.js on port 3000) ──────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public assets
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # All other requests → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── Backend API (Express on port 3001) ───────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Uploaded files — serve directly with cache
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=86400";
    }

    # API routes
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }
}
